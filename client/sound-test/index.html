<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sound test · pronunciation lexicon</title>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="./soundTest.css" />
  </head>
  <body>
    <main class="st-main">
      <header class="st-header">
        <h1>Sound test</h1>
        <p class="st-sub">
          Every term in <code>posts/common-terms.pls</code>, read by the production
          MOSS voice. Audition each respelling and re-roll any that come out wrong.
          <strong>Dev-only.</strong>
        </p>
      </header>

      <div class="st-toolbar">
        <button id="st-gen-all" class="st-btn st-btn-primary" type="button">
          Generate all missing
        </button>
        <button id="st-refresh" class="st-btn" type="button">Refresh</button>
        <span id="st-status" class="st-status" role="status" aria-live="polite"></span>
      </div>

      <div id="st-banner" class="st-banner" hidden></div>
      <div id="st-list" class="st-list"></div>
    </main>
    <script type="module" src="./soundTest.ts"></script>
  </body>
</html>
