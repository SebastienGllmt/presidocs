<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Blog</title>
<!-- Engine-owned stylesheet, referenced through the `engine` symlink. -->
<link rel="stylesheet" href="./engine/client/landing.css" />
<!-- Page-view analytics beacon (anonymous, cookieless). Posts pick this up
     transitively via narrator.ts; the landing has no narrator so it loads
     analytics.ts directly. See engine methodology.md → "Engagement analytics". -->
<script type="module" src="./engine/client/analytics.ts"></script>
<script type="module" src="./engine/client/swRegister.ts"></script>
</head>
<body>
  <main>
    <h1>my blog</h1>
    <p>
      Posts that feel like attending the talk. Hit <strong>Listen</strong> on
      any post &mdash; the page narrates itself and highlights what's being
      discussed.
    </p>
    <ul class="posts">
      <!-- One <li> per post. `bun run new-post <slug>` scaffolds the post;
           add its link here. Shape:
      <li>
        <a href="/posts/my-first-post">My first post</a>
        <span class="meta">A one-line teaser</span>
      </li>
      -->
    </ul>
    <!--
      PRIVATE BLOG? Delete the public block above (the intro paragraph and the
      <ul class="posts"> list) and uncomment this variant. Also see "Private
      blog" in README.md (BLOG_PRIVATE=1 + the two package.json script edits).
      Swap <title> and the <h1> below to your private blog's name.

      <h1>my private blog</h1>
      <p>
        This is a private blog: posts live at unguessable links and are shared
        directly with the people they're meant for. There is no index here — if
        someone sent you a link, that link is the way in.
      </p>
      <p>
        On a post you can hit <strong>Listen</strong> to have the page narrate
        itself (when the post carries audio), select any passage to leave a
        comment for the author, and use <strong>Copy as Markdown</strong> to
        take the text with you. Treat links you were given as private — anyone
        holding one can read that post.
      </p>

      This landing is the one guessable URL in a private deploy, so it must
      never link into /posts/ (audit-private.ts fails the build if it does):
      no post list, no search, just the how-to-use copy above.
    -->
  </main>
</body>
</html>
