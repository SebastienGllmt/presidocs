<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Read-Demo &mdash; talks, not just text</title>
<style>
  body {
    margin: 0;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    background: #fafbfc;
    color: #1f2328;
  }
  main {
    max-width: 640px;
    margin: 10vh auto 0;
    padding: 0 24px;
  }
  h1 { margin: 0 0 8px; font-size: 2rem; }
  p { color: #57606a; }
  .posts {
    margin-top: 32px;
    list-style: none;
    padding: 0;
  }
  .posts li {
    margin: 0 0 12px;
    padding: 16px 20px;
    background: #fff;
    border: 1px solid #e1e4e8;
    border-radius: 10px;
  }
  .posts a {
    color: #0969da;
    text-decoration: none;
    font-weight: 600;
  }
  .posts a:hover { text-decoration: underline; }
  .meta { display: block; font-size: 0.9rem; color: #6e7781; margin-top: 4px; }
</style>
</head>
<body>
  <main>
    <h1>read-demo</h1>
    <p>
      Blog posts that feel like attending the talk. Hit
      <strong>Listen</strong> on any post &mdash; the page narrates itself
      and highlights what's being discussed.
    </p>
    <ul class="posts">
      <li>
        <a href="/posts/hash-functions">What is a hash function?</a>
        <span class="meta">A 5-minute primer &middot; PoC sample</span>
      </li>
    </ul>
  </main>
</body>
</html>
