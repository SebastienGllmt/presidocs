# Cloudflare Workers configuration. See methodology.md → Deploy
# architecture for the rationale (one Worker per project, R2 binding,
# Workers Rate Limiting API, Static Assets binding).
#
# Secrets are NOT declared here — they're set via:
#   wrangler secret put SESSION_SECRET
#   wrangler secret put GOOGLE_OAUTH_CLIENT_ID
#   wrangler secret put GOOGLE_OAUTH_CLIENT_SECRET
#   wrangler secret put MICROSOFT_OAUTH_CLIENT_ID
#   wrangler secret put MICROSOFT_OAUTH_CLIENT_SECRET
#   wrangler secret put OAUTH_REDIRECT_BASE   # e.g. https://blog.example.com
# With nodejs_compat, these surface in `process.env.*` so the auth
# code reads them the same way it does in dev.

name = "blog-maker-read-demo"
main = "worker.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

# Built artifact directory from `bun run build`. Worker fetch handler
# falls through to this binding for anything that doesn't match an API
# route.
[assets]
directory = "./dist"
binding = "ASSETS"

# Per-post authorship lives in each post HTML's <meta name="author-email">
# tag and is baked into the Worker bundle at build time via
# `bun run build` → `server/postMeta.generated.ts`. No env var needed.

# Private R2 bucket holding per-(post, user) Automerge comment blobs.
# Bucket must be created out-of-band:
#   wrangler r2 bucket create blog-comments
[[r2_buckets]]
binding = "COMMENTS"
bucket_name = "blog-comments"

# Workers Rate Limiting API binding — sliding-window counter, keyed by
# our chosen string (we use `session.userId`). 10/min is generous for
# any legitimate use (no human writes more than 1-2 comments per
# minute) while bounding what a max-rate attacker can do; combined
# with the per-PUT delta cap (server/comments/routes.ts) it takes ~25
# seconds of sustained attack to fill one account's 32 KB blob.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
